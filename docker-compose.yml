version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: class-shoes-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: class_shoes_db
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: class-shoes-redis-db

    ports:
      - "6379:6379"

    restart: unless-stopped

volumes:
  pgdata:
    driver: local
