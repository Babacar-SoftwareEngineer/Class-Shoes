version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: class-shoes-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: class_shoes_db
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: class-shoes-redis-db
    ports:
      - "6379:6379"
    restart: unless-stopped

  k6:
    image: grafana/k6:latest
    container_name: class-shoes-k6
    environment:
      BASE_URL: http://host.docker.internal:5000
    volumes:
      - ./load-tests:/scripts
    entrypoint: ["/bin/sh", "-c"]
    command: ["k6 run /scripts/catalog-load-test.js"]

volumes:
  pgdata:
    driver: local
